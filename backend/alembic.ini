# A generic, single database configuration for Alembic in RETRACE.

[alembic]
# Path to migration scripts
script_location = backend/alembic

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with backend directory
prepend_sys_path = .

# Timezone for generated migration timestamps
timezone = UTC

# Max length of characters for "slug" field
truncate_slug_length = 40

# Database URL is injected dynamically by env.py from DATABASE_URL environment variable.
# NEVER commit real credentials or URLs into this file.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
